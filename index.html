<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/6082/6082072.png" />
    <title>Mestre Mune</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* --- PAPER MODE THEME OVERRIDES --- */
      body.paper-mode {
        background-color: #fcfbf7 !important; /* Cream White */
        color: #292524 !important; /* Stone 800 */
      }
      
      /* Base Slate Mappings */
      body.paper-mode .bg-slate-900, 
      body.paper-mode .bg-slate-950 {
        background-color: #fcfbf7 !important;
        border-color: #e7e5e4 !important; /* Stone 200 */
      }

      /* Fix for elements with opacity like bg-slate-900/95 (Log Header) and bg-slate-900/90 (Image Overlay) */
      body.paper-mode .bg-slate-900\/95,
      body.paper-mode .bg-slate-900\/90,
      body.paper-mode .bg-slate-900\/50,
      body.paper-mode .bg-slate-900\/80 {
        background-color: #fcfbf7 !important;
        border-color: #e7e5e4 !important;
        color: #292524 !important;
      }

      body.paper-mode .bg-slate-800 {
        background-color: #f5f5f4 !important; /* Stone 100 */
        border-color: #d6d3d1 !important; /* Stone 300 */
        color: #292524 !important;
      }
      
      /* Botões secundários (ex: Cancelar, Trash) - Mantém escuro mas força texto branco */
      body.paper-mode .bg-slate-700 {
        background-color: #57534e !important; /* Stone 600 */
        color: #ffffff !important;
      }

      /* Text Colors Mappings */
      body.paper-mode .text-slate-100,
      body.paper-mode .text-slate-200,
      body.paper-mode .text-slate-300,
      body.paper-mode .text-white {
        color: #292524 !important;
      }

      body.paper-mode .text-slate-400,
      body.paper-mode .text-slate-500 {
        color: #57534e !important; /* Stone 600 */
      }
      
      /* Borders */
      body.paper-mode .border-slate-700,
      body.paper-mode .border-slate-800 {
        border-color: #d6d3d1 !important;
      }
      
      /* Inputs */
      body.paper-mode input, 
      body.paper-mode textarea,
      body.paper-mode select {
        background-color: #ffffff !important;
        border: 1px solid #a8a29e !important;
        color: #000000 !important;
        box-shadow: none !important; /* Remove shadow interna strange in light mode */
      }

      /* Shadows Correction for Paper Mode (Softer) */
      body.paper-mode .shadow-2xl,
      body.paper-mode .shadow-xl,
      body.paper-mode .shadow-lg {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03) !important;
      }
      body.paper-mode .shadow-inner {
        box-shadow: none !important;
      }

      /* Specific colors for emphasis in Paper Mode */
      body.paper-mode .text-amber-500 { color: #d97706 !important; } /* Amber 600 */
      body.paper-mode .bg-amber-600 { background-color: #d97706 !important; }
      
      /* Dice Colors Fix - Darker text for light background */
      body.paper-mode .text-green-400 { color: #15803d !important; } /* Green 700 */
      body.paper-mode .bg-green-900\/30 { background-color: #dcfce7 !important; border-color: #86efac !important; } /* Green 100 */
      
      body.paper-mode .text-red-400 { color: #b91c1c !important; } /* Red 700 */
      body.paper-mode .bg-red-900\/30 { background-color: #fee2e2 !important; border-color: #fca5a5 !important; } /* Red 100 */

      /* --- END PAPER MODE --- */

      /* Prevent pull-to-refresh on mobile to feel like an app */
      body {
        overscroll-behavior-y: contain;
      }
      
      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      * {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Custom Animation: Bounce Low (Half height of standard Tailwind bounce) */
      @keyframes bounce-low {
        0%, 100% {
          transform: translateY(-12%); /* Standard is -25% */
          animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }
        50% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
      }
      .animate-bounce-low {
        animation: bounce-low 1s infinite;
      }

      /* --- PRINT STYLES (PDF Export) --- */
      @media print {
        @page {
          margin: 1cm;
          size: A4;
        }
        
        /* Reset Body */
        html, body {
          background-color: white !important;
          color: black !important;
          font-size: 11pt !important;
          line-height: 1.3 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          height: auto !important;
          overflow: visible !important;
        }

        /* Hide UI Elements */
        #root > div { height: auto !important; overflow: visible !important; }
        header, nav, button, .no-print, .fixed, .sticky {
          display: none !important;
        }
        
        /* Layout Reset */
        main {
          overflow: visible !important;
          height: auto !important;
          display: block !important;
        }
        
        .print-container {
          position: relative !important;
          display: block !important;
          overflow: visible !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        /* Typography Override */
        h1, h2, h3, h4 {
          color: black !important;
          page-break-after: avoid;
        }
        p, span, div {
          color: #1f2937 !important; /* Gray 800 */
        }
        
        /* Border Resets */
        .border-slate-800, .border-slate-700 {
          border-color: #e5e7eb !important; /* Gray 200 */
        }

        /* Force Flexbox behavior in print (often breaks) */
        .flex {
           display: flex !important;
        }
        
        /* Image Handling */
        img {
          max-width: 100% !important;
          height: auto !important;
          page-break-inside: avoid;
        }

        /* General Container Reset */
        .bg-slate-900, .bg-slate-800, .bg-slate-950 {
           background-color: transparent !important;
        }
        
        /* Scrollbar hide */
        ::-webkit-scrollbar { display: none; }
      }
    </style>
  <script type="importmap">
{
